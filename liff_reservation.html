<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>予約確認・変更31 - AiPost</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #1a237e;
    --primary-light: #3949ab;
    --accent: #00acc1;
    --success: #43a047;
    --warning: #fb8c00;
    --danger: #e53935;
    --bg: #f5f7fa;
    --surface: #ffffff;
    --border: #e0e4ed;
    --text: #1a1a2e;
    --text-sub: #6b7280;
    --text-light: #9ca3af;
  }
  .plan-demo-btn {
    font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.4); background: transparent; color: rgba(255,255,255,0.7);
    cursor: pointer;
  }
  .plan-demo-btn.active { background: rgba(255,255,255,0.9); color: #333; border-color: transparent; }
  body {
    font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    overflow-x: hidden;
    padding-bottom: 70px;
  }

  .header {
    background: var(--primary);
    color: white;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo { font-size: 15px; font-weight: 700; }
  .subbar {
    background: #13195f;
    padding: 6px 14px;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 40px;
    z-index: 99;
  }
  .header-sub { font-size: 11px; opacity: 0.75; margin-left: auto; }

  /* タブ */
  .tab-nav {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 70px;
    z-index: 98;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 4px;
    border: none;
    background: none;
    font-size: 11px;
    color: var(--text-sub);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .tab-icon { font-size: 16px; }

  .content { padding: 14px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* 使用状況バー */
  .usage-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .usage-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 4px solid var(--warning);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .usage-num { font-size: 14px; font-weight: 700; line-height: 1; }
  .usage-denom { font-size: 9px; color: var(--text-sub); }
  .usage-info { flex: 1; }
  .usage-title { font-size: 13px; font-weight: 600; }
  .usage-sub { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
  .usage-bar-bg { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .usage-bar-fill { height: 100%; border-radius: 3px; background: var(--warning); }

  /* 予約カード */
  .reservation-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: box-shadow 0.2s;
  }
  .reservation-card:active { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .card-header {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .card-date { font-size: 13px; font-weight: 600; }
  .card-time { font-size: 12px; color: var(--text-sub); }
  .sns-tags { display: flex; gap: 4px; margin-left: auto; }
  .sns-tag {
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
  }
  .tag-ig { background: #fce4ec; color: #c2185b; }
  .tag-x  { background: #f3f4f6; color: #374151; }
  .tag-th { background: #f3f4f6; color: #374151; }
  .card-body { padding: 10px 14px; }
  .card-text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-hashtag { font-size: 11px; color: var(--accent); }
  .card-footer {
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
  }
  .card-img-thumb {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .card-chars { font-size: 11px; color: var(--text-sub); }
  .card-ai-badge {
    margin-left: auto;
    font-size: 10px;
    background: #e8eaf6;
    color: var(--primary);
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 600;
  }
  .empty-list-note {
    text-align: center;
    color: var(--text-sub);
    font-size: 12px;
    padding: 32px 0;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-pending { background: var(--warning); }
  .dot-done { background: var(--success); }
  .dot-fail { background: var(--danger); }

  /* カレンダー */
  .calendar-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .cal-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .cal-title { font-size: 15px; font-weight: 700; }
  .cal-nav {
    background: none;
    border: none;
    font-size: 18px;
    color: var(--primary);
    cursor: pointer;
    padding: 4px 8px;
  }
  .cal-grid { padding: 8px; }
  .cal-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    margin-bottom: 4px;
  }
  .cal-day-label { font-size: 11px; color: var(--text-sub); padding: 4px 0; }
  .cal-day-label:first-child { color: var(--danger); }
  .cal-day-label:last-child { color: var(--accent); }
  .cal-dates { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-date {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    position: relative;
    padding: 2px;
  }
  .cal-date:hover { background: var(--bg); }
  .cal-date.today {
    background: var(--primary);
    color: white;
    font-weight: 700;
  }
  .cal-date.selected {
    background: var(--primary-light);
    color: white;
  }
  .cal-date.has-post { padding-top: 2px; justify-content: flex-start; gap: 1px; }
  .cal-post-count {
    font-size: 9px;
    font-weight: 700;
    color: white;
    background: var(--accent);
    border-radius: 8px;
    padding: 0px 4px;
    line-height: 1.6;
    min-width: 14px;
    text-align: center;
  }
  .cal-date.today .cal-post-count { background: rgba(255,255,255,0.9); color: var(--primary); }
  .cal-date.other-month { color: var(--text-light); }
  .cal-date.sunday { color: var(--danger); }
  .cal-date.saturday { color: var(--accent); }
  .cal-date.today.sunday, .cal-date.today.saturday { color: white; }

  /* 選択日の予約 */
  .selected-date-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-sub);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* 新規予約ボタン */
  .fab {
    position: fixed;
    bottom: 24px;
    right: 16px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    border: none;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(26,35,126,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 98;
    transition: transform 0.2s;
  }
  .fab:active { transform: scale(0.92); }

  /* 予約詳細モーダル */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1010; /* ★下部固定ナビバー(z-index:1000)より必ず上に表示するための設定 */
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 16px;
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 14px;
  }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    gap: 12px;
  }
  .detail-row:last-of-type { border-bottom: none; }
  .detail-key { color: var(--text-sub); flex-shrink: 0; }
  .detail-val { text-align: right; font-weight: 500; line-height: 1.6; }

  .post-text-box {
    background: var(--bg);
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.8;
    margin: 10px 0;
  }
  .hashtag-box { color: var(--accent); font-size: 12px; margin-top: 6px; }

  .modal-img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin-bottom: 12px;
  }

  .btn-row { display: flex; gap: 8px; margin-top: 14px; }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-outline { background: white; color: var(--primary); border: 1.5px solid var(--primary); }
  .btn-danger { background: #fee2e2; color: var(--danger); }

  /* 空状態 */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .empty-sub { font-size: 13px; color: var(--text-sub); line-height: 1.7; }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-sub);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }

  /* ★liff_reservation_html31：投稿履歴タブ（実データ化） */
  .cal-nav:disabled { opacity: 0.25; cursor: default; }
  .cal-date.blank { cursor: default; }
  .cal-date.blank:hover { background: none; }
  .history-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
    cursor: pointer;
  }
  .history-results { padding: 8px 14px; display: flex; flex-direction: column; gap: 5px; border-bottom: 1px solid var(--border); }
  .history-result-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .history-result-row .sns-tag { min-width: 26px; text-align: center; }
  .result-ok { color: var(--success); font-weight: 600; }
  .result-ng { color: var(--danger); font-weight: 600; }
  .history-text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .history-card.expanded .history-text { display: block; -webkit-line-clamp: unset; overflow: visible; }
  .history-more { font-size: 11px; color: var(--accent); margin-top: 4px; }
  .history-card.expanded .history-more { display: none; }

  /* ============================================ */
  /* ボトムナビゲーションバー（全画面共通） */
  /* ============================================ */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: #ffffff;
    border-top: 1px solid #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 1000;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    height: 100%;
    cursor: pointer;
    text-decoration: none;
    color: #9e9e9e;
    transition: color 0.2s;
    -webkit-tap-highlight-color: transparent;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    font-size: inherit;
    outline: none;
  }
  .nav-item.active { color: #1a237e; }
  .nav-item:active { opacity: 0.7; }
  .nav-icon { font-size: 18px; line-height: 1; margin-bottom: 2px; }
  .nav-label { font-size: 9px; font-weight: 600; letter-spacing: -0.3px; }

  @keyframes profile-loading-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

<div class="header">
  <span style="font-size:20px;">📅</span>
  <span class="header-logo">予約確認・変更31</span>
  <span class="header-sub">AiPost</span>
</div>

<!-- プラン・SNSサブバー -->
<div class="subbar">
  <div style="font-size:10px;color:rgba(255,255,255,0.9);display:flex;align-items:center;gap:8px;margin-bottom:3px;">
    <span class="plan-badge" id="plan-badge" style="background:#fff8e1;color:#e65100;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;">STANDARD</span>
    <span id="plan-price">¥1,280/月</span>
    <span style="color:rgba(255,255,255,0.6);">次回更新：2026年7月1日</span>
  </div>
  <div style="font-size:10px;color:rgba(255,255,255,0.7);display:flex;align-items:center;gap:6px;">
    <span>連携中：</span>
    <span id="subbar-sns-x" style="background:rgba(255,255,255,0.15);color:white;padding:1px 8px;border-radius:6px;font-weight:700;">X</span>
    <span id="subbar-sns-ig" style="background:rgba(255,255,255,0.15);color:white;padding:1px 8px;border-radius:6px;font-weight:700;">Instagram</span>
    <span id="subbar-sns-th" style="background:rgba(255,255,255,0.15);color:white;padding:1px 8px;border-radius:6px;font-weight:700;">Threads</span>
    <span id="reservation-quota" style="margin-left:auto;font-weight:700;">確認中…</span>
  </div>
</div>

<div class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('list')">
    <span class="tab-icon">📋</span>予約一覧
  </button>
  <button class="tab-btn" onclick="switchTab('calendar')">
    <span class="tab-icon">📆</span>予約カレンダー
  </button>
  <button class="tab-btn" onclick="switchTab('history')">
    <span class="tab-icon">✅</span>投稿履歴
  </button>
</div>

<div class="content">

  <!-- 予約一覧タブ -->
  <div id="tab-list" class="tab-panel active">

    <div class="section-label" id="reservation-list-label">予約中</div>

    <div id="reservation-list-container"></div>

  </div>

  <!-- カレンダータブ -->
  <div id="tab-calendar" class="tab-panel">

    <div class="calendar-wrap">
      <div class="cal-header">
        <button class="cal-nav">‹</button>
        <div class="cal-title">2026年6月</div>
        <button class="cal-nav">›</button>
      </div>
      <div class="cal-grid">
        <div class="cal-days">
          <div class="cal-day-label">日</div>
          <div class="cal-day-label">月</div>
          <div class="cal-day-label">火</div>
          <div class="cal-day-label">水</div>
          <div class="cal-day-label">木</div>
          <div class="cal-day-label">金</div>
          <div class="cal-day-label">土</div>
        </div>
        <div class="cal-dates" id="cal-dates"></div>
      </div>
    </div>

    <div id="selected-day-section" style="display:none;">
      <div class="selected-date-label">
        <span>📌</span>
        <span id="selected-day-label">6月13日の予約</span>
      </div>
      <div id="selected-day-cards"></div>
    </div>

    <div id="no-selected" class="empty-state" style="padding:24px 20px;">
      <div class="empty-icon">📆</div>
      <div class="empty-title">日付をタップしてください</div>
      <div class="empty-sub">投稿予約がある日には件数が表示されます</div>
    </div>

  </div>

  <!-- 投稿履歴タブ -->
  <div id="tab-history" class="tab-panel">

    <!-- 投稿件数表示 -->
    <!-- ★liff_reservation_html31：デモの「30件中22件」表示（予約枠と投稿数が混在し誤解を招く）と進捗バーを廃止し、今月の投稿件数のみの表示に変更 -->
    <div style="background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--border);display:flex;align-items:center;gap:12px;">
      <div style="text-align:center;flex-shrink:0;min-width:48px;">
        <div style="font-size:24px;font-weight:700;color:var(--primary);" id="history-month-count">-</div>
        <div style="font-size:10px;color:var(--text-sub);">件</div>
      </div>
      <div style="flex:1;">
        <div style="font-size:12px;font-weight:700;color:var(--text);">今月の投稿件数</div>
        <div style="font-size:10px;color:var(--text-sub);margin-top:3px;">SNSへの投稿処理が行われた予約の件数です</div>
      </div>
    </div>

    <div id="history-status" class="empty-list-note" style="display:none;"></div>

    <div class="calendar-wrap">
      <div class="cal-header">
        <button class="cal-nav" id="history-prev-month" onclick="changeHistoryMonth(-1)">‹</button>
        <div class="cal-title" id="history-cal-title"></div>
        <button class="cal-nav" id="history-next-month" onclick="changeHistoryMonth(1)">›</button>
      </div>
      <div class="cal-grid">
        <div class="cal-days">
          <div class="cal-day-label">日</div>
          <div class="cal-day-label">月</div>
          <div class="cal-day-label">火</div>
          <div class="cal-day-label">水</div>
          <div class="cal-day-label">木</div>
          <div class="cal-day-label">金</div>
          <div class="cal-day-label">土</div>
        </div>
        <div class="cal-dates" id="history-cal-dates"></div>
      </div>
    </div>

    <div id="history-selected-section" style="display:none;">
      <div class="selected-date-label">
        <span>✅</span>
        <span id="history-day-label"></span>
      </div>
      <div id="history-day-cards"></div>
    </div>

    <div id="history-no-selected" class="empty-state" style="padding:24px 20px;">
      <div class="empty-icon">📋</div>
      <div class="empty-title" id="history-empty-title">日付をタップしてください</div>
      <div class="empty-sub" id="history-empty-sub">投稿済みの日には件数が表示されます</div>
    </div>

  </div>

</div>

<!-- 新規予約ボタン -->
<div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px;background:white;border-top:1px solid var(--border);z-index:98;">
  <button onclick="alert('文章生成画面へ移動します')" style="width:100%;padding:14px;border-radius:12px;border:none;background:var(--primary);color:white;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">
    <span style="font-size:20px;">✏️</span>
    <span>投稿文を作って予約する</span>
  </button>
</div>

<!-- 予約詳細モーダル -->

// カレンダー生成
const postCounts = {15: 3, 17: 1, 20: 2, 25: 5, 28: 1}; // 日付:件数のマップ
const postDataByDay = {

const today = 13;
let selectedDay = null;

function buildCalendar() {
  const grid = document.getElementById('cal-dates');
  grid.innerHTML = '';
  // 2026年6月は月曜日始まり→日曜日=0から
  // 6月1日は月曜日
  const firstDay = 1; // 月曜=1、日曜スタートなので1マス空ける
  const days = 30;

  // 空白
  for (let i = 0; i < firstDay; i++) {
    const blank = document.createElement('div');
    blank.className = 'cal-date other-month';
    blank.textContent = 31 - firstDay + i + 1;
    grid.appendChild(blank);
  }

  for (let d = 1; d <= days; d++) {
    const el = document.createElement('div');
    const dayOfWeek = (firstDay + d - 1) % 7;
    let cls = 'cal-date';
    if (dayOfWeek === 0) cls += ' sunday';
    if (dayOfWeek === 6) cls += ' saturday';
    if (d === today) cls += ' today';
    if (postCounts[d]) cls += ' has-post';
    if (d === selectedDay) cls += ' selected';
    el.className = cls;
    // 件数バッジを含むHTML
    const count = postCounts[d];
    if (count) {
      el.innerHTML = `<span>${d}</span><span class="cal-post-count">${count}件</span>`;
    } else {
      el.textContent = d;
    }
    el.onclick = () => selectDay(d);
    grid.appendChild(el);
  }
}

function selectDay(d) {
  selectedDay = d;
  buildCalendar();
  const posts = postDataByDay[d];

          <div class="card-date">6月${d}日</div>

          <span class="card-ai-badge">✨ AI生成</span>

    }).join('');
  }
}

<script>
  // ============================================
  // ボトムナビゲーション共通処理
  // ============================================

  // 各LIFF画面のURL
  // ★liff_reservation_html17：画面遷移をliff.line.me経由からGitHub
  // 　Pagesの実URLへの直接遷移に一時変更したが、LIFFの再認証
  // 　リダイレクトを誘発する副作用が疑われたため、html18で元の
  // 　liff.line.me方式に撤回した。
  // ★liff_reservation_html18：liff.line.me経由を直接リンクに変更した
  // 　対応（html17）を撤回し、元のliff.line.me方式に戻す。
  const LIFF_URLS = {
    textgen:     'https://liff.line.me/2010401177-OpvemMmh',
    reservation: 'https://liff.line.me/2010401177-dM8eNjUM',
    analytics:   'https://liff.line.me/2010401177-qKtfKWP0',
    image:       'https://liff.line.me/2010401177-3pV56kDU',
    settings:    'https://liff.line.me/2010401177-XJw2kDQV',
    about:       'https://liff.line.me/2010401177-PtX79ibV',
    plan:        'https://liff.line.me/2010401177-IstPDnls',
    support:     'https://liff.line.me/2010401177-vwzTH30h',
  };

  // 他のLIFF画面に移動する
  function navigateTo(page) {
    if (LIFF_URLS[page]) {
      window.location.href = LIFF_URLS[page];
    }
  }

  // LINEトークルームに戻る
  function closeToLine() {
    liff.init({ liffId: '2010401177-dM8eNjUM' }).then(function() {
      liff.closeWindow();
    }).catch(function() {
      window.history.back();
    });
  }

  // ★liff_reservation_html19：保存先をlocalStorageからsessionStorage
  // 　に変更（アプリを完全に閉じたらキャッシュも消える必要があるため。
  // 　localStorageはアプリ再起動後も残ってしまい、要望に合わなかった）。
  // 　TTL管理は不要になったため撤廃した。
  const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbz58D6nB8fhSmc18eNgeqDEgo1NsJ4fJXgoobtpQFuztKrqieK9Eyy19fi8BiydbQcQcQ/exec';
  let LINE_UID = null;
  const QUOTA_CACHE_KEY = 'aipost_reservation_quota';

  // ★liff_reservation_html20：残り件数の表示を短縮し（daysUntilMonthEnd
  // 　は不要になったため削除）、サブバー下段（連携中の右側）に移動した。

  function readQuotaCache() {
    try {
      const raw = sessionStorage.getItem(QUOTA_CACHE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      return null;
    }
  }

  function writeQuotaCache(profileData, sns) {
    try {
      const cache = Object.assign({}, profileData, { sns: sns || null, fetchedAt: Date.now() });
      sessionStorage.setItem(QUOTA_CACHE_KEY, JSON.stringify(cache));
    } catch (err) {
      // sessionStorageが使えない環境でも動作は継続する
    }
  }

  // ★liff_reservation_html22：サブバー上部の「連携中：」表示が実データ
  // 　と連動しておらず、常に3SNSとも表示されたままになっていた不具合
  // 　を修正。cached.sns／取得したsnsのどちらの経路でも必ず適用する。
  function applySubbarSnsTags(sns) {
    if (!sns) return;
    const subbarIds = { x: 'subbar-sns-x', instagram: 'subbar-sns-ig', threads: 'subbar-sns-th' };
    Object.keys(subbarIds).forEach(function (key) {
      const el = document.getElementById(subbarIds[key]);
      if (el) el.style.display = sns[key] ? '' : 'none';
    });
  }

  function applyQuotaValues(plan, remainingReservable, sns) {
    const validPlans = ['FREE', 'PERSONAL', 'LITE', 'STANDARD', 'PRO'];
    if (validPlans.includes(plan)) {
      applyPlan(plan);
    }
    const el = document.getElementById('reservation-quota');
    if (el && typeof remainingReservable === 'number') {
      el.textContent = '残り投稿可能数' + remainingReservable + '件';
    }
    applySubbarSnsTags(sns);
  }

  // ★通信の一時的な失敗（GAS・スプレッドシート側の一時的な不調、想定外の応答など）に
  // 　備え、失敗した場合は1回だけ自動で再試行してから諦める。
  // 　成功時は応答（result）を、最終的に失敗した場合は null を返す。
  // 　isOk：応答が成功かどうかの判定（省略時は result.success が true なら成功）
  let lastGasError = '';
  async function postToGas(payload, label, isOk) {
    const check = isOk || function (r) { return r && r.success; };
    for (let attempt = 1; attempt <= 2; attempt++) {
      const t0 = Date.now();
      try {
        const response = await fetch(WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await response.json();
        if (check(result)) {
          traceLog(label + '取得OK' + (attempt > 1 ? '（再試行）' : '') + ' ' + (Date.now() - t0) + 'ms');
          return result;
        }
        lastGasError = String((result && (result.error || (result.data && result.data.error))) || '');
        traceLog(label + '取得NG(' + attempt + '回目) ' + lastGasError + ' ' + (Date.now() - t0) + 'ms');
      } catch (err) {
        lastGasError = String(err && err.message);
        traceLog(label + '通信エラー(' + attempt + '回目) ' + lastGasError + ' ' + (Date.now() - t0) + 'ms');
      }
      if (attempt < 2) await new Promise(function (resolve) { setTimeout(resolve, 1500); });
    }
    return null;
  }

  // ★診断用（一時的）：スピナーが2度出る原因を調べるため、画面の起動・スピナーの表示・
  // 　各データの取得結果（成否・所要時間）を端末（localStorage）に記録する。
  // 　ヘッダーのロゴを3回続けてタップすると、その履歴が表示される（新しい順）。
  // 　原因の調査が終わったら削除する。個人情報は記録しない。
  const TRACE_KEY = 'aipost_trace';
  const TRACE_SCREEN = '予約確認31';

  function traceLog(msg) {
    try {
      const arr = JSON.parse(localStorage.getItem(TRACE_KEY) || '[]');
      const d = new Date();
      const p2 = function (n) { return (n < 10 ? '0' : '') + n; };
      arr.push(p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()) + ' [' + TRACE_SCREEN + '] ' + msg);
      while (arr.length > 100) arr.shift();
      localStorage.setItem(TRACE_KEY, JSON.stringify(arr));
    } catch (err) {
      // 記録できなくても画面の動作は継続する
    }
  }

  function traceCacheState() {
    let q = '×', l = '×', a = '--', m = '×';
    try { if (sessionStorage.getItem('aipost_reservation_quota')) q = '○'; } catch (e) {}
    try { if (sessionStorage.getItem('aipost_reservation_list')) l = '○'; } catch (e) {}
    try {
      const c = JSON.parse(sessionStorage.getItem('aipost_analytics') || '{}');
      a = (c.summary ? 'S' : '-') + (c.calendar ? 'C' : '-');
    } catch (e) {}
    try { if (localStorage.getItem('aipost_master_data_cache')) m = '○'; } catch (e) {}
    return 'プラン等' + q + ' 予約一覧' + l + ' 分析' + a + ' マスタ' + m;
  }

  function traceStart() {
    let nav = '?';
    let n = '?';
    try { nav = performance.getEntriesByType('navigation')[0].type; } catch (e) {}
    try { n = sessionStorage.length; } catch (e) {}
    traceLog('起動 保存済み[' + traceCacheState() + '] 遷移=' + nav + ' 一時保存の項目数=' + n + ' 履歴数=' + history.length);
  }

  function showTrace() {
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem(TRACE_KEY) || '[]'); } catch (e) {}
    const old = document.getElementById('trace-panel');
    if (old) old.remove();
    const panel = document.createElement('div');
    panel.id = 'trace-panel';
    panel.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9000;background:rgba(0,0,0,0.88);color:#fff;font-size:10px;line-height:1.5;padding:12px;overflow:auto;';
    const bar = document.createElement('div');
    bar.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;';
    const closeBtn = document.createElement('button');
    closeBtn.textContent = '閉じる';
    closeBtn.style.cssText = 'padding:6px 14px;font-size:12px;';
    closeBtn.onclick = function () { panel.remove(); };
    const clearBtn = document.createElement('button');
    clearBtn.textContent = '履歴を消す';
    clearBtn.style.cssText = 'padding:6px 14px;font-size:12px;';
    clearBtn.onclick = function () { try { localStorage.removeItem(TRACE_KEY); } catch (e) {} panel.remove(); };
    bar.appendChild(closeBtn);
    bar.appendChild(clearBtn);
    const pre = document.createElement('pre');
    pre.style.cssText = 'white-space:pre-wrap;word-break:break-all;margin:0;';
    pre.textContent = arr.slice().reverse().join('\n') || '（履歴なし）';
    panel.appendChild(bar);
    panel.appendChild(pre);
    document.body.appendChild(panel);
  }

  (function () {
    let taps = 0;
    let timer = null;
    const logo = document.querySelector('.header-logo');
    if (!logo) return;
    logo.addEventListener('click', function () {
      taps++;
      clearTimeout(timer);
      timer = setTimeout(function () { taps = 0; }, 800);
      if (taps >= 3) { taps = 0; showTrace(); }
    });
  })();

  // ★liff_reservation_html24：マスタデータ・分析データの先読み。
  // 　アプリ起動後の最初の画面が予約確認画面だった場合でも、その後に設定画面・
  // 　分析画面を開いた時にスピナーが出ないよう、プラン・SNS連携状況の取得と
  // 　同じスピナー表示の間に、保存済みでないデータを一緒に取得して保存する。
  // 　キー・保存形式は liff_settings.html／liff_analytics.html と同一。
  // 　・マスタデータ（設定画面用）：localStorage・24時間TTL（設定画面の仕様）
  // 　・分析データ：sessionStorageの`aipost_analytics`（{ summary, calendar }）
  const MASTER_DATA_CACHE_KEY = 'aipost_master_data_cache';
  const MASTER_DATA_CACHE_TTL_MS = 24 * 60 * 60 * 1000; // 24時間
  const ANALYTICS_CACHE_KEY = 'aipost_analytics';

  function readMasterDataCache() {
    try {
      const raw = localStorage.getItem(MASTER_DATA_CACHE_KEY);
      if (!raw) return null;
      const cache = JSON.parse(raw);
      if (!cache.fetchedAt || Date.now() - cache.fetchedAt > MASTER_DATA_CACHE_TTL_MS) return null;
      return cache.data;
    } catch (err) {
      return null;
    }
  }

  function writeMasterDataCache(data) {
    try {
      localStorage.setItem(MASTER_DATA_CACHE_KEY, JSON.stringify({ data: data, fetchedAt: Date.now() }));
    } catch (err) {
      // localStorageが使えない環境でも動作は継続する
    }
  }

  // 保存済み（24時間以内）でなければマスタデータを取得して保存する
  async function warmupMasterDataCache() {
    if (readMasterDataCache()) return;
    const result = await postToGas({ action: 'getMasterData', lineUid: LINE_UID, params: {} }, 'マスタデータ');
    if (result && result.data) writeMasterDataCache(result.data);
  }

  function readAnalyticsCache() {
    try {
      const raw = sessionStorage.getItem(ANALYTICS_CACHE_KEY);
      if (!raw) return null;
      const cache = JSON.parse(raw);
      return cache && typeof cache === 'object' ? cache : null;
    } catch (err) {
      return null;
    }
  }

  function writeAnalyticsCache(part, data) {
    try {
      const cache = readAnalyticsCache() || {};
      cache[part] = data;
      sessionStorage.setItem(ANALYTICS_CACHE_KEY, JSON.stringify(cache));
    } catch (err) {
      // sessionStorageが使えない環境でも動作は継続する
    }
  }

  // 予約のキャンセル等で数値が変わる「今日の状況」（summary）だけを無効にする
  // （投稿日別データ＝calendarは、投稿が実行されるまで変わらないため残す）
  function invalidateAnalyticsSummaryCache() {
    try {
      const cache = readAnalyticsCache();
      if (!cache) return;
      delete cache.summary;
      sessionStorage.setItem(ANALYTICS_CACHE_KEY, JSON.stringify(cache));
    } catch (err) {
      // 無効化に失敗しても画面の動作は継続する
    }
  }

  async function fetchAnalyticsPartToCache(action, part) {
    const label = part === 'summary' ? '分析(今日の状況)' : '分析(カレンダー)';
    const result = await postToGas({ action: action, lineUid: LINE_UID, params: {} }, label, function (r) { return r && r.success && r.data && !r.data.error; });
    if (result) writeAnalyticsCache(part, result.data);
  }

  // 保存済みでない分析データだけを取得して保存する（すべて保存済みなら何もしない）
  async function warmupAnalyticsCache() {
    const cache = readAnalyticsCache();
    const tasks = [];
    if (!(cache && cache.summary)) tasks.push(fetchAnalyticsPartToCache('getAnalyticsSummary', 'summary'));
    if (!(cache && cache.calendar)) tasks.push(fetchAnalyticsPartToCache('getAnalyticsCalendarData', 'calendar'));
    if (!(cache && cache.periodSummary)) tasks.push(fetchAnalyticsPartToCache('getAnalyticsPeriodSummary', 'periodSummary'));
    await Promise.all(tasks);
  }

  // ★liff_reservation_html16：起動時にキャッシュが無く実際に取得する
  // 　場合のみ（showOverlay=true）、設定画面と同じ見た目のスピナーを
  // 　表示する（画面ごとに読み込み表現がバラバラだった点への対応）。
  async function fetchReservationQuota(showOverlay) {
    const el = document.getElementById('reservation-quota');
    if (el) el.textContent = '確認中…';
    const overlay = document.getElementById('profile-loading-overlay');
    if (showOverlay && overlay) overlay.classList.add('open');
    if (showOverlay) traceLog('スピナー開始（プラン等の保存なし）');
    try {
      const tasks = [
        postToGas({ action: 'getUserProfile', lineUid: LINE_UID }, 'プロフィール'),
        postToGas({ action: 'getSnsStatus', lineUid: LINE_UID }, 'SNS連携状況')
      ];
      // ★liff_reservation_html24：スピナーを出している間（起動後の最初の画面）に、
      // 　他画面が使うマスタデータも一緒に取得する（保存済みなら何もしない）。
      // ★liff_reservation_html26：分析データは取得に数秒〜十数秒かかるため、スピナーの
      // 　終了を待たせず、裏側で取得する（分析画面を開いた時にまだ無ければ、分析画面が取得する）。
      // ★liff_reservation_html27：実機の履歴で、分析データの取得を同時に始めると、プロフィール等の
      // 　軽い取得まで遅くなりスピナーが7〜10秒に延びていた（GAS側で同時の取得が競合する）ため、
      // 　分析データの取得は、スピナーが終わった後（下のfinally内）に開始するよう変更した。
      if (showOverlay) tasks.push(warmupMasterDataCache());
      const [profileResult, snsResult] = await Promise.all(tasks);
      if (!profileResult || !profileResult.data || profileResult.data.found === false) {
        traceLog('プロフィール取得NG found=' + (profileResult && profileResult.data && profileResult.data.found));
        return;
      }

      const sns = (snsResult && snsResult.data) ? {
        x: snsResult.data.x === '連携中',
        instagram: snsResult.data.instagram === '連携中',
        threads: snsResult.data.threads === '連携中',
        xAccount: snsResult.data.xAccount || '',
        instagramAccount: snsResult.data.instagramAccount || '',
        threadsAccount: snsResult.data.threadsAccount || ''
      } : null;

      applyQuotaValues(profileResult.data.plan, profileResult.data.remainingReservable, sns);
      writeQuotaCache(profileResult.data, sns);
    } catch (err) {
      console.error('プラン・残り予約可能件数の取得エラー:', err);
    } finally {
      if (showOverlay) traceLog('スピナー終了（プラン等）');
      if (showOverlay && overlay) overlay.classList.remove('open');
      // スピナーが終わってから、裏側で分析データを取得する（保存済みなら何もしない）
      if (showOverlay) warmupAnalyticsCache();
    }
  }

  // キャッシュがあればそれを使い（通信しない）、無ければ取得する
  function applyQuotaFromCacheOrFetch() {
    const cached = readQuotaCache();
    if (cached) {
      applyQuotaValues(cached.plan, cached.remainingReservable, cached.sns);
      // ★liff_reservation_html24：この画面では使わないデータ（マスタデータ・分析データ）
      // 　が保存されていなければ、スピナーを出さずに裏側で取得する
      warmupMasterDataCache();
      warmupAnalyticsCache();
    } else {
      fetchReservationQuota(true);
    }
  }

  async function initLiff() {
    try {
      await liff.init({ liffId: '2010401177-dM8eNjUM' });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      const idToken = liff.getDecodedIDToken();
      LINE_UID = idToken.sub;
      applyQuotaFromCacheOrFetch();
      fetchAndRenderReservationList();
      // ★liff_reservation_html31：LINE UIDの取得前に投稿履歴タブが開かれていた場合は、ここで取得する
      if (postHistoryRequested) ensurePostHistoryLoaded();
    } catch (err) {
      console.error('LIFF初期化エラー:', err);
      alert('LINEアプリ内でこの画面を開いてください。');
    }
  }

  // ★liff_reservation_html11：予約一覧タブを実データ表示に切り替え。
  // 　予約カレンダー・投稿履歴タブ、予約の「修正」機能は今回のスコープ
  // 　外（別途対応予定）。
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text == null ? '' : text;
    return div.innerHTML;
  }

  function snsTagHtml(sns) {
    if (sns === 'Instagram') return '<span class="sns-tag tag-ig">IG</span>';
    if (sns === 'Threads') return '<span class="sns-tag tag-th">TH</span>';
    return '<span class="sns-tag tag-x">X</span>';
  }

  function formatScheduledAt(isoString) {
    const dt = new Date(isoString);
    const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
    const dateLabel = (dt.getMonth() + 1) + '月' + dt.getDate() + '日（' + dayNames[dt.getDay()] + '）';
    const timeLabel = dt.getHours() + '時ごろ';
    return { dateLabel: dateLabel, timeLabel: timeLabel };
  }

  function renderReservationCard(r) {
    const time = formatScheduledAt(r.scheduledAt);
    const tags = r.targetSns.map(snsTagHtml).join('');
    return '' +
      '<div class="reservation-card" onclick="openDetail(\'' + r.reservationId + '\')">' +
        '<div class="card-header">' +
          '<div class="status-dot dot-pending"></div>' +
          '<div class="card-date">' + time.dateLabel + '</div>' +
          '<div class="card-time">' + time.timeLabel + '</div>' +
          '<div class="sns-tags">' + tags + '</div>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="card-text">' + escapeHtml(r.honbun) + '</div>' +
        '</div>' +
        '<div class="card-footer">' +
          '<div class="card-img-thumb">' + (r.hasImage ? '🖼️' : '') + '</div>' +
        '</div>' +
      '</div>';
  }

  // 一覧タブで最後に取得した予約データ（タップ時に詳細モーダルへ
  // 渡すためのキャッシュ。再取得のたびに更新する）
  let currentReservationList = [];
  let currentDetailReservationId = null;
  const RESERVATION_LIST_CACHE_KEY = 'aipost_reservation_list';

  // ★liff_reservation_html19：予約一覧も、プラン・残り件数等と同じく
  // 　sessionStorageにキャッシュし、画面を再度開いた時に毎回取得し
  // 　直さないようにした。キャッシュを無効化（再取得）するタイミングは
  // 　「新規予約を作成した時」（liff_textgen.html側でこのキーを削除）
  // 　「この画面でキャンセルした時」（下のexecuteCancel内）のみ。
  function renderReservationList(list) {
    const container = document.getElementById('reservation-list-container');
    const label = document.getElementById('reservation-list-label');
    if (!container) return;
    currentReservationList = list;
    if (label) label.textContent = '予約中（' + list.length + '件）';
    container.innerHTML = list.length
      ? list.map(renderReservationCard).join('')
      : '<div class="empty-list-note">現在、予約中の投稿はありません</div>';
  }

  async function fetchAndRenderReservationList(forceRefresh) {
    if (!forceRefresh) {
      try {
        const cachedRaw = sessionStorage.getItem(RESERVATION_LIST_CACHE_KEY);
        if (cachedRaw) {
          renderReservationList(JSON.parse(cachedRaw));
          return;
        }
      } catch (err) {
        // キャッシュの読み込みに失敗した場合は通常通り取得する
      }
    }

    const container = document.getElementById('reservation-list-container');
    if (container) container.innerHTML = '<div class="empty-list-note">読み込み中…</div>';
    traceLog('予約一覧: 保存なし→取得');
    try {
      const result = await postToGas({ action: 'getMyReservations', lineUid: LINE_UID }, '予約一覧', function (r) { return r && r.success && Array.isArray(r.data); });
      if (!result) {
        // ★liff_reservation_html26：取得できなかった場合は「予約なし」と誤表示せず、保存もしない
        if (container) container.innerHTML = '<div class="empty-list-note">予約一覧を取得できませんでした</div>';
        return;
      }
      renderReservationList(result.data);
      try { sessionStorage.setItem(RESERVATION_LIST_CACHE_KEY, JSON.stringify(result.data)); } catch (err) {}
    } catch (err) {
      console.error('予約一覧の取得エラー:', err);
      if (container) container.innerHTML = '<div class="empty-list-note">予約一覧を取得できませんでした</div>';
    }
  }

  // ★liff_reservation_html13：詳細モーダル・キャンセル確認モーダルを
  // 　実データで動作するようにした。「修正する」ボタンは、修正機能
  // 　自体がまだ実装されていないため非表示にしている（実装時に表示
  // 　に戻す）。
  function openDetail(reservationId) {
    const r = currentReservationList.find(function (item) { return item.reservationId === reservationId; });
    if (!r) return;
    currentDetailReservationId = reservationId;

    const time = formatScheduledAt(r.scheduledAt);
    document.getElementById('detail-schedule').textContent = time.dateLabel + time.timeLabel;
    document.getElementById('detail-sns').textContent = r.targetSns.join('・');
    document.getElementById('detail-charcount').textContent = r.honbun.length + '文字';
    document.getElementById('detail-posttext').textContent = r.honbun;
    document.getElementById('detail-modal').classList.add('open');
  }
  function closeDetail() {
    document.getElementById('detail-modal').classList.remove('open');
  }
  function confirmCancel() {
    const r = currentReservationList.find(function (item) { return item.reservationId === currentDetailReservationId; });
    if (r) {
      const time = formatScheduledAt(r.scheduledAt);
      document.getElementById('cancel-modal-text').textContent =
        time.dateLabel + time.timeLabel + 'の予約をキャンセルします。予約枠が1件解放されます。';
    }
    document.getElementById('cancel-modal').classList.add('open');
  }
  function closeCancelModal() {
    document.getElementById('cancel-modal').classList.remove('open');
  }
  async function executeCancel() {
    const reservationId = currentDetailReservationId;
    const btn = document.getElementById('cancel-modal-btn');
    if (btn) { btn.disabled = true; btn.textContent = '処理中…'; }
    try {
      const response = await fetch(WEBAPP_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'cancelReservation',
          lineUid: LINE_UID,
          params: { reservationId: reservationId }
        })
      });
      const result = await response.json();
      if (result.success && result.data && result.data.success) {
        closeCancelModal();
        closeDetail();
        fetchAndRenderReservationList(true);
        fetchReservationQuota();
        // ★liff_reservation_html24：キャンセルで今月の投稿枠が変わるため、分析の
        // 　「今日の状況」の保存済みデータを無効にし、裏側（スピナーなし）で取得し直す
        invalidateAnalyticsSummaryCache();
        warmupAnalyticsCache();
      } else {
        alert((result.data && result.data.error) || 'キャンセルに失敗しました。もう一度お試しください。');
      }
    } catch (err) {
      console.error('キャンセル処理エラー:', err);
      alert('通信エラーが発生しました。もう一度お試しください。');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'キャンセルする'; }
    }
  }

  // ============================================
  // ★liff_reservation_html31：投稿履歴タブ（実データ）
  // ============================================
  // ・取得は「投稿履歴タブを初めて開いた時」のみ（GAS：getMyPostHistory）。
  // 　投稿は予約時刻に裏側で実行されるため、sessionStorageには保存しない
  // 　（保存すると新しい投稿が反映されない時間が生じる）。4画面共通の先読みにも含めない。
  // ・いいね・コメント等の反応数は表示しない（反応の確認は分析画面の役割）。
  // ・各SNSの結果は、投稿履歴シートの「◯◯投稿結果」列の値をそのまま表示する
  // 　（「成功」は緑、それ以外＝失敗・除外は赤。空欄＝投稿対象外のSNSは表示しない）。
  const HISTORY_SNS_ORDER = ['X', 'Instagram', 'Threads'];
  let postHistoryItems = null;      // 取得済みの履歴（未取得はnull）
  let postHistoryLoading = false;
  let postHistoryRequested = false; // LINE UID取得前にタブが開かれた場合の予約
  let postHistoryByDate = {};       // 'YYYY-MM-DD' → その日の履歴（新しい順）
  let historyViewYear = null;
  let historyViewMonth = null;      // 0〜11
  let historySelectedKey = null;

  function historyDateKey(dt) {
    const p2 = function (n) { return (n < 10 ? '0' : '') + n; };
    return dt.getFullYear() + '-' + p2(dt.getMonth() + 1) + '-' + p2(dt.getDate());
  }

  function setHistoryStatus(html) {
    const el = document.getElementById('history-status');
    if (!el) return;
    el.innerHTML = html || '';
    el.style.display = html ? 'block' : 'none';
  }

  function ensurePostHistoryLoaded() {
    if (postHistoryItems !== null || postHistoryLoading) return;
    if (!LINE_UID) {
      postHistoryRequested = true;
      setHistoryStatus('読み込み中…');
      return;
    }
    loadPostHistory();
  }

  async function loadPostHistory() {
    if (postHistoryLoading) return;
    postHistoryLoading = true;
    setHistoryStatus('読み込み中…');
    try {
      const result = await postToGas(
        { action: 'getMyPostHistory', lineUid: LINE_UID, params: {} },
        '投稿履歴',
        function (r) { return r && r.success && r.data && r.data.success && Array.isArray(r.data.items); }
      );
      if (!result) {
        // 取得できなかった場合は「履歴なし」と誤表示しない
        setHistoryStatus('投稿履歴を取得できませんでした<br><button class="btn btn-outline" style="flex:none;margin-top:10px;padding:8px 20px;" onclick="loadPostHistory()">再読み込み</button>');
        return;
      }
      postHistoryItems = result.data.items.map(function (item) {
        return {
          reservationId: item.reservationId,
          postedAt: new Date(item.postedAt),
          honbun: item.honbun || '',
          results: item.results || {}
        };
      }).filter(function (item) { return !isNaN(item.postedAt.getTime()); });
      postHistoryItems.sort(function (a, b) { return b.postedAt.getTime() - a.postedAt.getTime(); });

      postHistoryByDate = {};
      postHistoryItems.forEach(function (item) {
        const key = historyDateKey(item.postedAt);
        if (!postHistoryByDate[key]) postHistoryByDate[key] = [];
        postHistoryByDate[key].push(item);
      });

      setHistoryStatus('');
      renderPostHistory();
    } catch (err) {
      console.error('投稿履歴の取得エラー:', err);
      setHistoryStatus('投稿履歴を取得できませんでした<br><button class="btn btn-outline" style="flex:none;margin-top:10px;padding:8px 20px;" onclick="loadPostHistory()">再読み込み</button>');
    } finally {
      postHistoryLoading = false;
    }
  }

  function renderPostHistory() {
    const now = new Date();
    // 今月の投稿件数
    const monthCount = postHistoryItems.filter(function (item) {
      return item.postedAt.getFullYear() === now.getFullYear() && item.postedAt.getMonth() === now.getMonth();
    }).length;
    document.getElementById('history-month-count').textContent = monthCount;

    if (postHistoryItems.length === 0) {
      document.getElementById('history-empty-title').textContent = 'まだ投稿履歴はありません';
      document.getElementById('history-empty-sub').textContent = '予約した投稿が実行されると、ここに結果が表示されます';
    }

    if (historyViewYear === null) {
      historyViewYear = now.getFullYear();
      historyViewMonth = now.getMonth();
    }
    buildPostHistoryCalendar();
  }

  // 月送りの範囲：最も古い投稿の月〜今月
  function historyMonthRange() {
    const now = new Date();
    const max = now.getFullYear() * 12 + now.getMonth();
    let min = max;
    if (postHistoryItems && postHistoryItems.length) {
      const oldest = postHistoryItems[postHistoryItems.length - 1].postedAt;
      min = Math.min(max, oldest.getFullYear() * 12 + oldest.getMonth());
    }
    return { min: min, max: max };
  }

  function changeHistoryMonth(delta) {
    if (postHistoryItems === null) return;
    const range = historyMonthRange();
    const next = historyViewYear * 12 + historyViewMonth + delta;
    if (next < range.min || next > range.max) return;
    historyViewYear = Math.floor(next / 12);
    historyViewMonth = next % 12;
    historySelectedKey = null;
    showHistoryDay(null);
    buildPostHistoryCalendar();
  }

  function buildPostHistoryCalendar() {
    const grid = document.getElementById('history-cal-dates');
    if (!grid || historyViewYear === null) return;
    document.getElementById('history-cal-title').textContent = historyViewYear + '年' + (historyViewMonth + 1) + '月';

    const range = historyMonthRange();
    const current = historyViewYear * 12 + historyViewMonth;
    document.getElementById('history-prev-month').disabled = current <= range.min;
    document.getElementById('history-next-month').disabled = current >= range.max;

    grid.innerHTML = '';
    const firstDay = new Date(historyViewYear, historyViewMonth, 1).getDay();
    const days = new Date(historyViewYear, historyViewMonth + 1, 0).getDate();
    const todayKey = historyDateKey(new Date());

    for (let i = 0; i < firstDay; i++) {
      const blank = document.createElement('div');
      blank.className = 'cal-date blank';
      grid.appendChild(blank);
    }
    for (let d = 1; d <= days; d++) {
      const key = historyDateKey(new Date(historyViewYear, historyViewMonth, d));
      const posts = postHistoryByDate[key];
      const dayOfWeek = (firstDay + d - 1) % 7;
      let cls = 'cal-date';
      if (dayOfWeek === 0) cls += ' sunday';
      if (dayOfWeek === 6) cls += ' saturday';
      if (key === todayKey) cls += ' today';
      if (posts) cls += ' has-post';
      if (key === historySelectedKey) cls += ' selected';
      const el = document.createElement('div');
      el.className = cls;
      if (posts) {
        el.innerHTML = '<span>' + d + '</span><span class="cal-post-count">' + posts.length + '件</span>';
      } else {
        el.textContent = d;
      }
      el.onclick = function () { selectHistoryDate(key, d); };
      grid.appendChild(el);
    }
  }

  function selectHistoryDate(key, d) {
    historySelectedKey = key;
    buildPostHistoryCalendar();
    showHistoryDay(key, d);
  }

  function showHistoryDay(key, d) {
    const section = document.getElementById('history-selected-section');
    const empty = document.getElementById('history-no-selected');
    if (!key) {
      section.style.display = 'none';
      empty.style.display = 'block';
      return;
    }
    const posts = postHistoryByDate[key] || [];
    section.style.display = 'block';
    empty.style.display = 'none';
    document.getElementById('history-day-label').textContent =
      (historyViewMonth + 1) + '月' + d + '日の投稿（' + posts.length + '件）';
    document.getElementById('history-day-cards').innerHTML = posts.length
      ? posts.map(renderHistoryCard).join('')
      : '<div class="empty-list-note">この日の投稿はありません</div>';
  }

  function renderHistoryCard(item) {
    const p2 = function (n) { return (n < 10 ? '0' : '') + n; };
    const timeLabel = item.postedAt.getHours() + ':' + p2(item.postedAt.getMinutes());
    const targets = HISTORY_SNS_ORDER.filter(function (sns) { return item.results[sns]; });
    const allOk = targets.length > 0 && targets.every(function (sns) { return item.results[sns] === '成功'; });
    const dotClass = targets.length === 0 ? '' : (allOk ? 'dot-done' : 'dot-fail');
    const rows = targets.length
      ? targets.map(function (sns) {
          const value = item.results[sns];
          const ok = value === '成功';
          return '<div class="history-result-row">' + snsTagHtml(sns) +
            '<span class="' + (ok ? 'result-ok' : 'result-ng') + '">' + escapeHtml(value) + '</span></div>';
        }).join('')
      : '<div class="history-result-row" style="color:var(--text-sub);">投稿先の記録がありません</div>';
    const longText = item.honbun.length > 60;
    return '' +
      '<div class="history-card"' + (longText ? ' onclick="this.classList.toggle(\'expanded\')"' : ' style="cursor:default;"') + '>' +
        '<div class="card-header">' +
          (dotClass ? '<div class="status-dot ' + dotClass + '"></div>' : '') +
          '<div class="card-date">' + timeLabel + '</div>' +
          '<div class="card-time">に投稿</div>' +
        '</div>' +
        '<div class="history-results">' + rows + '</div>' +
        '<div class="card-body">' +
          '<div class="history-text">' + escapeHtml(item.honbun) + '</div>' +
          (longText ? '<div class="history-more">タップで全文を表示</div>' : '') +
        '</div>' +
      '</div>';
  }

  traceStart();
  initLiff();
</script>
</body>
</html>
